services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RedisUrl: ${RedisUrl:-}
      AccountID: ${AccountID:-}
      AccessKeyID: ${AccessKeyID:-}
      AccessKeySecret: ${AccessKeySecret:-}
      BucketName: ${BucketName:-}
    depends_on:
      dragonfly:
        condition: service_healthy

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  dragonfly-data:
